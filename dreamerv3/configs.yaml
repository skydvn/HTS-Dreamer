# Ablation toggles (compose on top of htp_atari100k):
htp_separable:
  agent.htp.proj.separable: true            # Eq. 37 stronger isolation

htp_joint:
  agent.htp.grad_to_backbone: true          # App. A.3 fully-joint regime

htp_matryoshka_only:                        # drop multi-stride, keep progressive recon
  agent.loss_scales.htp_pdyn: 0.0

htp_pdyn_only:                              # drop progressive recon, keep multi-stride
  agent.loss_scales.htp_rec: 0.0

htp_reverse_strides:                        # sanity check — reverses the paper's inductive bias
  agent.htp.pdyn.strides: [1, 2, 4, 8, 16]

htp_empty_projection:                       # HTP scaffold, no auxiliary supervision
  agent.loss_scales.htp_rec: 0.0
  agent.loss_scales.htp_pdyn: 0.0


# ============================================================================
# Append these blocks to your existing configs.yaml.
# They add Slim-HTP and its companion sanity arms.
# ============================================================================

# ---- Preset: Slim-HTP (paper's proposed lightweight variant) ----
#
# What's on:
#   * HTP scaffold enabled
#   * Multi-stride prefix dynamics (htp_pdyn) targeting prefixes of h_t
#   * Gradients from htp_pdyn flow into the RSSM backbone (required — see below)
# What's off:
#   * htp_proj (no learned projection; z_t IS h_t)
#   * slow_htp_proj (target for pdyn is sg(h_{t+Δ}), not a slow projection)
#   * htp_recon (degenerate without a projection — see agent guard)
#   * VICReg regularizer (off by default; enable via htp_slim_vicreg preset)
#
# Notes:
#   * grad_to_backbone MUST be true. With use_proj=false and false backbone
#     gradients, htp_pdyn becomes decorative (only F_ω trains, h_t unchanged).
#     The htp_slim_postHoc preset below exists specifically to demonstrate
#     this equivalence with baseline.
#   * pdyn.dims must fit inside feat_dim = deter + stoch*classes = 10240
#     (with your defaults). The suggested schedule keeps the compact prefix at
#     128 and lets the full prefix use all 10240 dims.
#
htp_slim:
  agent.htp.enabled: true
  agent.htp.grad_to_backbone: true
  agent.htp.use_proj: false
  agent.htp.use_recon: false
  agent.htp.use_vicreg: false
  agent.htp.pdyn.dims: [128, 512, 2048, 5120, 10240]
  agent.htp.pdyn.strides: [16, 8, 4, 2, 1]
  agent.htp.pdyn.hidden: 512
  agent.htp.pdyn.layers: 2
  agent.htp.pdyn.norm: rms
  agent.htp.pdyn.act: silu
  agent.htp.pdyn.outscale: 1.0

# ---- Preset: Slim-HTP with VICReg anti-collapse ----
#
# Same as htp_slim but adds a variance regularizer on each prefix. Insurance
# against representation collapse now that the slow-target mechanism is gone.
# Use this if htp_slim shows signs of collapse (htp_pdyn loss diverging,
# per-prefix mean std collapsing to zero, actor ent going to zero, etc.).
#
htp_slim_vicreg:
  agent.htp.enabled: true
  agent.htp.grad_to_backbone: true
  agent.htp.use_proj: false
  agent.htp.use_recon: false
  agent.htp.use_vicreg: true
  agent.htp.vicreg_gamma: 1.0        # threshold: per-coord std must exceed 1.0
  agent.htp.vicreg_scale: 1.0        # loss scale for the regularizer
  agent.htp.pdyn.dims: [128, 512, 2048, 5120, 10240]
  agent.htp.pdyn.strides: [16, 8, 4, 2, 1]
  agent.htp.pdyn.hidden: 512
  agent.htp.pdyn.layers: 2
  agent.htp.pdyn.norm: rms
  agent.htp.pdyn.act: silu
  agent.htp.pdyn.outscale: 1.0

# ---- Preset: Slim-HTP post-hoc (SANITY CHECK — should equal baseline) ----
#
# Slim-HTP with grad_to_backbone=false. htp_pdyn trains its own predictors but
# their gradients don't reach h_t (there's no projection to absorb them). This
# means HTP has no way to influence the actor/critic through the representation.
# Expected result: performance identical to `baseline`. If it isn't, something
# is leaking gradients that shouldn't be.
#
# This preset exists to prove that the projection-or-backbone-grad requirement
# in Slim-HTP is real. Include this arm in the ablation table.
#
htp_slim_postHoc:
  agent.htp.enabled: true
  agent.htp.grad_to_backbone: false
  agent.htp.use_proj: false
  agent.htp.use_recon: false
  agent.htp.use_vicreg: false
  agent.htp.pdyn.dims: [128, 512, 2048, 5120, 10240]
  agent.htp.pdyn.strides: [16, 8, 4, 2, 1]
  agent.htp.pdyn.hidden: 512
  agent.htp.pdyn.layers: 2
  agent.htp.pdyn.norm: rms
  agent.htp.pdyn.act: silu
  agent.htp.pdyn.outscale: 1.0

# ---- Convenience: launch Slim-HTP for Atari 100K ----
#
# Chains htp_atari100k with htp_slim so a single --configs argument runs the
# right training regime and logs the right metrics.
#
htp_slim_atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}
  logger.filter: 'score|length|fps|ratio|train/loss/|train/rand/|train/htp_'
  # Layer htp_slim on top:
  agent.htp.enabled: true
  agent.htp.grad_to_backbone: true
  agent.htp.use_proj: false
  agent.htp.use_recon: false
  agent.htp.use_vicreg: false
  agent.htp.pdyn.dims: [128, 512, 2048, 5120, 10240]
  agent.htp.pdyn.strides: [16, 8, 4, 2, 1]
  agent.htp.pdyn.hidden: 512
  agent.htp.pdyn.layers: 2
  agent.htp.pdyn.norm: rms
  agent.htp.pdyn.act: silu
  agent.htp.pdyn.outscale: 1.0

# ---- Note on loss_scales ----
#
# The default `agent.loss_scales` dict in your `defaults` block lists both
# htp_rec and htp_pdyn. The revised agent.py drops htp_rec from self.scales
# automatically when use_recon=false (Slim-HTP), and adds htp_vicreg when
# use_vicreg=true, so no changes are needed to loss_scales for these presets.
#