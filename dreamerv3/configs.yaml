defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False, use_seed: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    log_policy_video: True
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    deterministic: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3, htp_rec: 1.0, htp_pdyn: 1.0}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False
    hts:
      impl: hts2
      latent_anchor_name: rssm_repfeat
      latent_anchor_source_module: dreamerv3.rssm.RSSM.loss
      levels: 6
      head_dim: 32
      topk: 8
      topk_per_level: [8, 8, 8, 8, 8, 8]
      strides: [32, 16, 8, 4, 2, 1]
      strides_coarse_to_fine: [32, 16, 8, 4, 2, 1]
      hidden: 256
      layers: 2
      action_units: 128
      proj_dim: 64
      beta_hier: [0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667]
      alpha_sdyn: [0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667, 0.1666666667]
      act: silu
      norm: rms
      l_hier: 0.1
      l_sdyn: 0.1
      l_ctrl: 0.0
      l_temp: 0.01
      l_vc: 0.01
      l_sparse: 1e-5
      use_lhier: True
      use_lsdyn: True
      use_lctrl: False
      use_ltemp: True
      use_lvc: True
      use_lsparse: True
      use_lred: False
      method: auxiliary_hierarchy
      sparsity_mode: levelwise_topk
      actor_critic_input: rssm_feat
      actor_critic_stopgrad_z: False
      hier_beta0: 1.0
      hier_rho: 0.75
      ctrl_reward_scale: 1.0
      ctrl_continue_scale: 1.0
      ctrl_value_scale: 1.0
      discount: 0.997
      temporal_k_pos: 4
      temporal_temperature: 0.1
      temporal_far_negative_mode: none
      decoder_prefix_stop_gradient: True
      predictor_prefix_stop_gradient: False
      dynamics_target_stop_gradient: True
      temporal_min_far_distance: 16
      temporal_far_weight: 0.25
      training_regime: joint
      phase1_steps: 0
      phase2_steps: 0
      backbone_lr_scale: 1.0
      hts_lr_scale: 1.0
      hierarchy_lr_scale: 1.0
      warmup_steps: 0
      aux_warmup_raw_frames: 0
      aux_warmup_agent_actions: 0
      aux_warmup_optimizer_updates: 0
      aux_warmup_mode: linear
      aux_warmup_action_repeat: 4
      aux_warmup_train_ratio: 256
      vicreg_gamma: 1.0
      vicreg_cov_scale: 1.0
      variant: hts_full
      flat_width: 192
      flat_topk: 48
      sgf_action_units: 18

    htp:
      enabled: false          # turn on via `htp_atari100k` preset below
      grad_to_backbone: false # false = post-hoc (App. A.3), true = fully joint
      proj:
        dims: [ 128, 256, 512, 1024, 2048 ]
        hidden: 512
        layers: 2
        norm: rms
        act: silu             # matches your codebase-wide default
        separable: false
        outscale: 1.0
      recon:
        hidden: 512
        layers: 1
        norm: rms
        act: silu
        outscale: 1.0
      pdyn:
        strides: [ 16, 8, 4, 2, 1 ]   # non-increasing: compact prefix -> longer stride
        hidden: 512
        layers: 2
        norm: rms
        act: silu
        outscale: 1.0
    slowhtp: { rate: 0.02, every: 1 }   # mirrors your existing slowvalue

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

